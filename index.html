<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a1918'/><text x='50' y='55' font-family='serif' font-weight='bold' font-size='50' fill='%23d97706' text-anchor='middle' dominant-baseline='central'>AF.</text></svg>">
    <title>Ahmed Fakhreldin - Associate Integration Engineer</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bg: {
                            DEFAULT: '#1a1918',
                            secondary: '#232120',
                            tertiary: '#2d2b29'
                        },
                        text: {
                            DEFAULT: '#e8e6e3',
                            muted: '#a8a6a3',
                            dim: '#666462'
                        },
                        accent: {
                            DEFAULT: '#d97706', // Warm Amber
                            light: '#f59e0b',
                            dim: '#92400e'
                        },
                        border: {
                            DEFAULT: '#44403c'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Lora', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- React and ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            scroll-behavior: smooth;
        }

        body {
            background-color: #1a1918;
            color: #e8e6e3;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Vintage Noise Overlay */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1918;
        }

        ::-webkit-scrollbar-thumb {
            background: #44403c;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #d97706;
        }

        .heading-serif {
            font-family: 'Lora', serif;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Compact Layout Tweaks */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #44403c, transparent);
            margin: 0 auto;
            width: 80%;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="bg-bg text-text relative min-h-screen">
    <!-- Noise Overlay -->
    <div class="noise-overlay"></div>

    <div id="root"></div>

    <script type="text/babel">

            return <i data-lucide={name} className={`inline-block align-text-bottom ${className}`} style={{ width: size, height: size }}></i>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

</body>

</html>
